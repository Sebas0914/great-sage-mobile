name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create . --platforms=android --project-name great_sage_mobile

      - name: Restore GREAT SAGE Android integration
        run: |
          mkdir -p android/app/src/main/kotlin/com/example/great_sage_mobile
          cp .github/android/MainActivity.kt android/app/src/main/kotlin/com/example/great_sage_mobile/MainActivity.kt
          cp .github/android/RaphaelOverlayService.kt android/app/src/main/kotlin/com/example/great_sage_mobile/RaphaelOverlayService.kt
          cp .github/android/DeviceAutomationService.kt android/app/src/main/kotlin/com/example/great_sage_mobile/DeviceAutomationService.kt
          mkdir -p android/app/src/main/res/xml
          cp .github/android/accessibility_service_config.xml android/app/src/main/res/xml/accessibility_service_config.xml
          cp .github/android/strings.xml android/app/src/main/res/values/strings.xml
          cp .github/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Restore GREAT SAGE icon
        run: |
          python3 -m pip install --disable-pip-version-check -q pillow
          curl -L --fail --retry 3 -o /tmp/great_sage_icon.ico https://raw.githubusercontent.com/Sebas0914/Great-Sage/main/icon.ico
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          src = Image.open('/tmp/great_sage_icon.ico')
          frames = []
          for i in range(getattr(src, 'n_frames', 1)):
              src.seek(i)
              frames.append(src.copy().convert('RGBA'))
          best = max(frames, key=lambda im: im.width * im.height)
          out = Path('android/app/src/main/res/drawable/great_sage_icon.png')
          out.parent.mkdir(parents=True, exist_ok=True)
          best.save(out, format='PNG', optimize=True)
          print('Using GREAT SAGE source icon: ' + str(best.size))
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Generate release signing key
        run: |
          keytool -genkeypair -v \\
            -keystore android/release-keystore.jks \\
            -storepass greatsage-release \\
            -keypass greatsage-release \\
            -alias great-sage \\
            -keyalg RSA -keysize 2048 -validity 10000 \\
            -dname "CN=GREAT SAGE, OU=Mobile, O=GREAT SAGE, L=Ensenada, ST=Baja California, C=MX"

      - name: Sign APK (v2/v3)
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" sign \\
            --ks android/release-keystore.jks \\
            --ks-pass pass:greatsage-release \\
            --key-pass pass:greatsage-release \\
            --ks-key-alias great-sage \\
            --v1-signing-enabled true \\
            --v2-signing-enabled true \\
            --v3-signing-enabled true \\
            build/app/outputs/flutter-apk/app-release.apk
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-release.apk
          rm -f android/release-keystore.jks

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: great-sage-mobile-apk
          path: build/app/outputs/flutter-apk/app-release.apk
